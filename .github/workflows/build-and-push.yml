# Optional pipeline: build the image on GitHub, push it to your Amazon ECR repository,
# then (optionally) deploy it to your ECS service.
# Setup steps: docs/PIPELINE.md (C.1–C.5).
#
# Runs when you click "Run workflow" (Actions tab), and on every push to main that
# changes app.py, index.html or the Dockerfile. Without the repository variables it skips.
# No access keys: GitHub signs in to AWS with a short-lived token (OIDC) and the IAM role you created.

name: Build, push and deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag. Leave empty for an automatic one (v + run number, e.g. v7)"
        required: false
        default: ""
      deploy:
        description: "Also deploy to ECS (needs the ECS_* variables)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [app.py, index.html, Dockerfile]

permissions:
  id-token: write   # lets GitHub request the OIDC token AWS trusts
  contents: read    # lets the job read the code

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    # On a push, run only once the variables are set (forks skip quietly).
    # A manual run always starts, so it can tell you what's missing.
    if: github.event_name == 'workflow_dispatch' || vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      TAG: ${{ inputs.tag }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Check the repository variables and the tag
        run: |
          missing=""
          [ -n "$AWS_ROLE_ARN" ] || missing="$missing AWS_ROLE_ARN"
          [ -n "$AWS_REGION" ] || missing="$missing AWS_REGION"
          [ -n "$ECR_REPOSITORY" ] || missing="$missing ECR_REPOSITORY"
          if [ -n "$missing" ]; then
            echo "::error::Add these in Settings → Secrets and variables → Actions → Variables:$missing"
            exit 1
          fi
          # No tag given (every push, or an empty box): tag it automatically with
          # v + this workflow's run number, which GitHub counts up: v5, v6, v7...
          if [ -z "$TAG" ]; then
            TAG="v${GITHUB_RUN_NUMBER}"
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9._-]{1,128}$'; then
            echo "::error::The tag may only use letters, digits, '.', '_' and '-' (for example v1)."
            exit 1
          fi

      - name: Get the code
        uses: actions/checkout@v4

      - name: Sign in to AWS (no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log Docker in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # GitHub runners share IP addresses, so anonymous pulls of the base image from
      # ECR Public can hit "429 Too Many Requests". Signed-in pulls get a higher limit.
      # ECR Public sign-in only works in us-east-1.
      - name: Log Docker in to Amazon ECR Public (for the base image)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public
        env:
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1

      - name: Build the image (same as README Step 2)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build --platform linux/amd64 --build-arg APP_VERSION="$TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .

      - name: Push the image to ECR (same as README Step 3)
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"
          echo "### ✅ Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "Image URI for your task definition: \`$REGISTRY/$ECR_REPOSITORY:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build-and-push
    # Deploy only when the ECS variables are set, and (for a manual run) "deploy" is ticked.
    if: vars.ECS_SERVICE != '' && (github.event_name == 'push' || inputs.deploy)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}

    steps:
      - name: Check the ECS variables
        run: |
          missing=""
          [ -n "$ECS_CLUSTER" ] || missing="$missing ECS_CLUSTER"
          [ -n "$ECS_TASK_DEFINITION" ] || missing="$missing ECS_TASK_DEFINITION"
          [ -n "$ECS_CONTAINER_NAME" ] || missing="$missing ECS_CONTAINER_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Add these in Settings → Secrets and variables → Actions → Variables:$missing"
            exit 1
          fi

      - name: Sign in to AWS (no access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Start from the latest revision you made in the Console (README Step 5), so CPU, memory,
      # port, logs and roles stay exactly as you set them. Only the image changes.
      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Put the new image in the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      # Same as README Step 8: new revision → update service → rolling deployment.
      - name: Deploy to ECS (rolling deployment)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Summary
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          echo "### 🚀 Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Service \`$ECS_SERVICE\` in cluster \`$ECS_CLUSTER\` now runs \`$IMAGE\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Open: ECS → Clusters → $ECS_CLUSTER → Services → $ECS_SERVICE → Tasks → task → Public IP, then http://<public-ip>:8080" >> "$GITHUB_STEP_SUMMARY"
